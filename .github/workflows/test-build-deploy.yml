name: 🧪 Test 🏗️ Build 🚀 Deploy

on:
  pull_request:
    branches: [dev, develop, qa, release, 'clients/**', 'seabaas-mizan', 'mizan']
  push:
    branches: [dev, develop, qa, release, 'clients/**', 'seabaas-mizan', 'mizan']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      APP_NAME:
        description: 'Optional manifest filename override (develop/release or release tag)'
        required: false
        default: ''
#deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  pipeline:
    uses: sterling-retailcore-team/workflow-templates/.github/workflows/pipeline.yml@bepeerless
    secrets: inherit
    with:
      CALLER_EVENT_NAME: ${{ github.event_name }}
      # ── App ───────────────────────────────────────────────────────────────
      APP_NAME: 'trade-api'
      MODULES: '[""]'
      HAS_CORE_SERVICE: true
      HAS_MONOREPO: false
      MFE: false
      USE_BUILD_ARGS: false
      BUILD_ARGS: ''
      PROJECT: 'core'
      LANGUAGE: 'auto'          # auto | java | nodejs | python | dotnet | go
      BUILD_COMMAND: ''
      SCAN_PATHS: '.'
      ALLOW_VULN_PUSH: true

      # ── Integration tests & DAST ──────────────────────────────────────────
      POSTMANCOLLECTIONID: ''   # your Postman Collection UID
      POSTMANENVID: ''          # your Postman Environment UID
      BASEURL: ''               # base URL for Postman tests (optional)
